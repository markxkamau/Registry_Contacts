<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Company | RegistryPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(2, 6, 23) 90%);
            color: #f8fafc;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vibrant-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        .vibrant-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vibrant-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .input-glow:focus {
            box-shadow: 0 0 15px -3px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-lg">
        <div class="mb-8 text-center">
            <a th:href="@{/contact/all_contacts}"
                class="inline-flex items-center text-slate-400 hover:text-white transition-colors mb-6 group">
                <i class="fa-solid fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i>
                Back to Registry
            </a>
            <div
                class="vibrant-gradient w-16 h-16 rounded-2xl flex items-center justify-center shadow-xl shadow-indigo-500/20 mx-auto mb-4">
                <i class="fa-solid fa-building text-white text-3xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Register Company</h1>
            <p class="text-slate-400">Initialize a new business entity in the registry.</p>
        </div>

        <div class="glass-card rounded-[2.5rem] p-10 shadow-2xl">
            <form action="#" th:action="@{/company/new_company}" th:object="${company_info}" method="post"
                class="space-y-8">
                <div>
                    <label
                        class="block mb-3 text-sm font-semibold text-slate-300 ml-1 italic uppercase tracking-wider">Company
                        Name</label>
                    <div class="relative">
                        <i class="fa-solid fa-signature absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" th:field="*{name}" placeholder="Enter official company name"
                            class="bg-slate-800/50 border border-slate-700 text-white text-lg rounded-2xl focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 block w-full pl-12 pr-4 py-4 transition-all outline-none input-glow placeholder:text-slate-600"
                            required>
                    </div>
                    <p class="text-rose-400 text-sm mt-3 flex items-center gap-2" th:if="${company_alert}">
                        <i class="fa-solid fa-circle-exclamation text-xs"></i>
                        <span th:text="${company_alert}">Error message</span>
                    </p>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="vibrant-gradient text-white font-bold rounded-2xl text-lg w-full py-4 text-center shadow-lg shadow-indigo-500/20 vibrant-button flex items-center justify-center gap-3">
                        <i class="fa-solid fa-rocket"></i>
                        Confirm Registration
                    </button>
                    <p class="text-center text-slate-500 text-sm mt-6">
                        <i class="fa-solid fa-info-circle mr-1"></i> You can add contacts after registration.
                    </p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
