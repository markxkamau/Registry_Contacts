<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Contact | RegistryPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 10% 20%, rgb(15, 23, 42) 0%, rgb(2, 6, 23) 90%);
            color: #f8fafc;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .brand-font {
            font-family: 'Outfit', sans-serif;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .vibrant-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        }

        .vibrant-button {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .vibrant-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center p-6">
    <div class="w-full max-w-2xl text-center">
        <div class="mb-8">
            <div
                class="vibrant-gradient w-20 h-20 rounded-[2rem] flex items-center justify-center shadow-xl shadow-indigo-500/20 mx-auto mb-6">
                <i class="fa-solid fa-circle-check text-white text-3xl animate-pulse"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-2">Review Registration</h1>
            <p class="text-slate-400">Please verify the contact details before finalizing.</p>
        </div>

        <div class="glass-card rounded-[2.5rem] overflow-hidden shadow-2xl mb-8">
            <div class="p-8 border-b border-slate-700/50 bg-slate-800/30">
                <div class="flex flex-col items-center">
                    <span class="text-indigo-400 font-mono text-sm bg-indigo-500/10 px-3 py-1 rounded-full mb-3"
                        th:text="'Company ID: #' + ${company_info.id}">#123</span>
                    <h2 class="text-2xl font-bold text-white" th:text="${company_info.name}">Company Name</h2>
                </div>
            </div>

            <div class="p-10 space-y-8">
                <div
                    class="relative py-6 px-8 bg-slate-800/40 rounded-2xl border border-slate-700/50 inline-block mx-auto min-w-[300px]">
                    <span
                        class="absolute -top-3 left-6 bg-indigo-500 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-widest">Phone
                        Number</span>
                    <p class="text-3xl font-bold text-indigo-300 tracking-tight" th:text="${contact_info.number}">+1 234
                        567 890</p>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 justify-center">
                    <a th:href="@{/contact/all_contacts}"
                        class="vibrant-gradient text-white font-bold rounded-2xl px-10 py-4 w-full sm:w-auto shadow-lg shadow-indigo-500/20 vibrant-button flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check-circle"></i>
                        Confirm & Save
                    </a>
                    <a th:href="@{'/company/home/'+${company_info.id}}"
                        class="bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-2xl px-10 py-4 w-full sm:w-auto shadow-lg shadow-slate-900/20 vibrant-button flex items-center justify-center gap-2 border border-slate-600/50">
                        <i class="fa-solid fa-pen-to-square"></i>
                        Edit Details
                    </a>
                </div>
            </div>
        </div>

        <p class="text-slate-500 text-sm italic">
            <i class="fa-solid fa-shield-check mr-1"></i> Data will be encrypted upon confirmation.
        </p>
    </div>
</body>

</html>
